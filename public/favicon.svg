<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#3a58f0"/>
      <stop offset=".55" stop-color="#16278f"/>
      <stop offset="1" stop-color="#070f3d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd23f" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#ff4fa3" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <!-- chrome mesh head -->
    <radialGradient id="head" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#d9e0ee"/>
      <stop offset=".6" stop-color="#8d98b3"/>
      <stop offset="1" stop-color="#394261"/>
    </radialGradient>
    <pattern id="mesh" width="4.2" height="4.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H4.2M0 0V4.2" stroke="#1b2442" stroke-opacity=".42" stroke-width=".9" fill="none"/>
    </pattern>
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" x2="1">
      <stop offset="0" stop-color="#4b5575"/>
      <stop offset=".3" stop-color="#f4f7ff"/>
      <stop offset=".55" stop-color="#aab4cc"/>
      <stop offset="1" stop-color="#3a4262"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#a8740c"/>
      <stop offset=".3" stop-color="#ffe98a"/>
      <stop offset=".6" stop-color="#ffc62e"/>
      <stop offset="1" stop-color="#8a5a06"/>
    </linearGradient>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#0c0f1c"/>
      <stop offset=".28" stop-color="#4d546f"/>
      <stop offset=".42" stop-color="#242a40"/>
      <stop offset="1" stop-color="#06080f"/>
    </linearGradient>
    <linearGradient id="pinkG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8cc6"/>
      <stop offset="1" stop-color="#e0267f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <clipPath id="headClip"><circle cx="64" cy="38" r="23"/></clipPath>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>

  <g transform="rotate(32 64 66)">
    <circle cx="64" cy="38" r="46" fill="url(#glow)"/>
    <g filter="url(#shadow)">
      <!-- handle -->
      <path d="M50 68 L78 68 L74.5 112 Q64 119 53.5 112 Z" fill="url(#body)"/>
      <path d="M55 70 L58.5 70 L57 112 L55.5 111 Z" fill="#fff" fill-opacity=".3"/>
      <rect x="60.5" y="80" width="7" height="13" rx="3.5" fill="#0a0c16"/>
      <rect x="62.2" y="82" width="3.6" height="5" rx="1.8" fill="#ff4fa3"/>
      <g stroke="#000" stroke-opacity=".55" stroke-width="1.2">
        <path d="M52.4 100 Q64 104 75.6 100"/>
        <path d="M52.8 104 Q64 108 75.2 104"/>
      </g>
      <!-- gold ring + chrome collar -->
      <rect x="47.5" y="63" width="33" height="7" rx="3.5" fill="url(#gold)"/>
      <path d="M44 56 Q64 66 84 56 L82 64 Q64 71 46 64 Z" fill="url(#chrome)"/>
      <!-- mesh head -->
      <circle cx="64" cy="38" r="23" fill="url(#head)"/>
      <circle cx="64" cy="38" r="23" fill="url(#mesh)" clip-path="url(#headClip)"/>
      <circle cx="64" cy="38" r="23" fill="none" stroke="#2b3454" stroke-opacity=".7" stroke-width="1.5"/>
      <ellipse cx="55" cy="27.5" rx="9" ry="6.5" fill="url(#spec)" transform="rotate(-28 55 27.5)"/>
      <circle cx="49.5" cy="31" r="1.6" fill="#fff" fill-opacity=".8"/>
    </g>
  </g>

  <!-- glossy music note -->
  <g filter="url(#shadow)">
    <ellipse cx="22" cy="34.5" rx="7" ry="5.4" transform="rotate(-22 22 34.5)" fill="url(#pinkG)"/>
    <rect x="26.6" y="14" width="3.8" height="21" rx="1.9" fill="url(#pinkG)"/>
    <path d="M27.5 14 Q38 15 38.5 25 Q33.5 20.5 27.5 22 Z" fill="url(#pinkG)"/>
    <ellipse cx="20.3" cy="32.5" rx="2" ry="1.2" fill="#fff" fill-opacity=".6" transform="rotate(-22 20.3 32.5)"/>
  </g>
</svg>
