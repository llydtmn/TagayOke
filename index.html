<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6ecd4" />
    <meta name="description" content="Sing. Sip. Repeat. A videoke queue for your phone and your TV." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tagay-Oke!" />
    <title>Tagay-Oke! · Sing. Sip. Repeat.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
      /* Same cream as the splash screen, so nothing but the splash shows while the app loads */
      html, body { margin: 0; background: #f6ecd4; color: #221c16; font-family: sans-serif; }
    </style>

    <!-- Old-browser error display. Plain ES5 on purpose. -->
    <script>
      (function () {
        function show(msg) {
          var d = document.getElementById('err-box');
          if (!d) {
            d = document.createElement('pre');
            d.id = 'err-box';
            d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;margin:0;padding:12px;' +
              'background:#900;color:#fff;font:18px/1.3 monospace;white-space:pre-wrap;max-height:50%;overflow:auto';
            (document.body || document.documentElement).appendChild(d);
          }
          d.appendChild(document.createTextNode(msg + '\n'));
        }
        window.onerror = function (m, src, line, col) {
          show('ERROR: ' + m + ' (' + (src || '').split('/').pop() + ':' + line + ':' + col + ')');
        };
        window.addEventListener('unhandledrejection', function (e) {
          show('PROMISE: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:2rem">Please enable JavaScript to use Tagay-Oke!</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
